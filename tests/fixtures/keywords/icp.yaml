canisters:
  - name: keywords
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/keywords/keywords.did python3 -m basilisk keywords src/main.py
            - cp .basilisk/keywords/keywords.wasm "$ICP_WASM_OUTPUT_PATH"
    candid: .basilisk/keywords/keywords.did
