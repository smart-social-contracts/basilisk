canisters:
  - name: init_and_post_upgrade_recovery
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/init_and_post_upgrade_recovery/init_and_post_upgrade_recovery.did python3 -m basilisk init_and_post_upgrade_recovery src/main.py
            - cp .basilisk/init_and_post_upgrade_recovery/init_and_post_upgrade_recovery.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
