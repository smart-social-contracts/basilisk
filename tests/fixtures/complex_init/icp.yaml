canisters:
  - name: complex_init
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/complex_init/complex_init.did python3 -m basilisk complex_init src/main.py
            - cp .basilisk/complex_init/complex_init.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
