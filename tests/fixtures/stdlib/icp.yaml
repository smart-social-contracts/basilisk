canisters:
  - name: stdlib
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/stdlib/stdlib.did python3 -m basilisk stdlib src/main.py
            - cp .basilisk/stdlib/stdlib.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
