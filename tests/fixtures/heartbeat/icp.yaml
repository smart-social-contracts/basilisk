canisters:
  - name: heartbeat_async
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/heartbeat_async/heartbeat_async.did python3 -m basilisk heartbeat_async src/heartbeat_async/main.py
            - cp .basilisk/heartbeat_async/heartbeat_async.wasm "$ICP_WASM_OUTPUT_PATH"
  - name: heartbeat_sync
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/heartbeat_sync/heartbeat_sync.did python3 -m basilisk heartbeat_sync src/heartbeat_sync/main.py
            - cp .basilisk/heartbeat_sync/heartbeat_sync.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
