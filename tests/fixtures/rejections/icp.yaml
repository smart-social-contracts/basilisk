canisters:
  - name: rejections
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/rejections/rejections.did python3 -m basilisk rejections src/rejections/rejections.py
            - cp .basilisk/rejections/rejections.wasm "$ICP_WASM_OUTPUT_PATH"
    candid: .basilisk/rejections/rejections.did
  - name: some_service
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/some_service/some_service.did python3 -m basilisk some_service src/some_service/some_service.py
            - cp .basilisk/some_service/some_service.wasm "$ICP_WASM_OUTPUT_PATH"
    candid: .basilisk/some_service/some_service.did
