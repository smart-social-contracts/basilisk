canisters:
  - name: simple_erc20
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/simple_erc20/simple_erc20.did python3 -m basilisk simple_erc20 src/main.py
            - cp .basilisk/simple_erc20/simple_erc20.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
