canisters:
  - name: management_canister
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/management_canister/management_canister.did python3 -m basilisk management_canister src/management_canister.py
            - cp .basilisk/management_canister/management_canister.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
