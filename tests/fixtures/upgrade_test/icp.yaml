canisters:
  - name: controller
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/controller/controller.did python3 -m basilisk controller src/controller/main.py
            - cp .basilisk/controller/controller.wasm "$ICP_WASM_OUTPUT_PATH"
  - name: target
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/target/target.did python3 -m basilisk target src/target_v1/main.py
            - cp .basilisk/target/target.wasm "$ICP_WASM_OUTPUT_PATH"
  - name: target_v2
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/target_v2/target_v2.did python3 -m basilisk target_v2 src/target_v2/main.py
            - cp .basilisk/target_v2/target_v2.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
