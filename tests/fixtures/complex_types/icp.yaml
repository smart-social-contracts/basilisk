canisters:
  - name: complex_types
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/complex_types/complex_types.did python3 -m basilisk complex_types src/complex_types.py
            - cp .basilisk/complex_types/complex_types.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
