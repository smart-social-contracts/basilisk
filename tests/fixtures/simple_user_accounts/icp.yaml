canisters:
  - name: simple_user_accounts
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/simple_user_accounts/simple_user_accounts.did python3 -m basilisk simple_user_accounts src/main.py
            - cp .basilisk/simple_user_accounts/simple_user_accounts.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
