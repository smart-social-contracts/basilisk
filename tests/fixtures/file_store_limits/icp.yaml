# Heavy file-store integration tests use 10T deploy_cycles — see
# tests/integration/conftest.py (_DEPLOY_CYCLES).
canisters:
  - name: file_store_limits
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/file_store_limits/file_store_limits.did python3 -m basilisk file_store_limits src/main.py
            - cp .basilisk/file_store_limits/file_store_limits.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
