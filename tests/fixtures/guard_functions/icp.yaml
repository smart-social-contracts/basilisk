canisters:
  - name: guard_functions
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/guard_functions/guard_functions.did python3 -m basilisk guard_functions src/main.py
            - cp .basilisk/guard_functions/guard_functions.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
