canisters:
  - name: browse_custom
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/browse_custom/browse_custom.did python3 -m basilisk browse_custom src/main.py
            - cp .basilisk/browse_custom/browse_custom.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
