canisters:
  - name: inspect_message
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/inspect_message/inspect_message.did python3 -m basilisk inspect_message src/main.py
            - cp .basilisk/inspect_message/inspect_message.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
