canisters:
  - name: list_of_lists
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/list_of_lists/list_of_lists.did python3 -m basilisk list_of_lists src/main.py
            - cp .basilisk/list_of_lists/list_of_lists.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
