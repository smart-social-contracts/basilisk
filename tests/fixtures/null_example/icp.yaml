canisters:
  - name: null_example
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/null_example/null_example.did python3 -m basilisk null_example src/main.py
            - cp .basilisk/null_example/null_example.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
