canisters:
  - name: quicksort
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/quicksort/quicksort.did python3 -m basilisk quicksort src/main.py
            - cp .basilisk/quicksort/quicksort.wasm "$ICP_WASM_OUTPUT_PATH"
    candid: .basilisk/quicksort/quicksort.did
