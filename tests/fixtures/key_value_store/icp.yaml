canisters:
  - name: key_value_store
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/key_value_store/key_value_store.did python3 -m basilisk key_value_store src/main.py
            - cp .basilisk/key_value_store/key_value_store.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
