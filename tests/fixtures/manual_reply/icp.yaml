canisters:
  - name: manual_reply
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/manual_reply/manual_reply.did python3 -m basilisk manual_reply src/main.py
            - cp .basilisk/manual_reply/manual_reply.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
