canisters:
  - name: service
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/service/service.did python3 -m basilisk service src/service/service.py
            - cp .basilisk/service/service.wasm "$ICP_WASM_OUTPUT_PATH"
  - name: some_service
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/some_service/some_service.did python3 -m basilisk some_service src/some_service/some_service.py
            - cp .basilisk/some_service/some_service.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
