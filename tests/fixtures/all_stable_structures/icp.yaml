canisters:
  - name: all_stable
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/all_stable/all_stable.did python3 -m basilisk all_stable src/main.py
            - cp .basilisk/all_stable/all_stable.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
