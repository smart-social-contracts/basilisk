canisters:
  - name: audio_recorder
    build:
      steps:
        - type: script
          commands:
            - CANISTER_CANDID_PATH=.basilisk/audio_recorder/audio_recorder.did python3 -m basilisk audio_recorder src/main.py
            - cp .basilisk/audio_recorder/audio_recorder.wasm "$ICP_WASM_OUTPUT_PATH"

# Non-default gateway port so test networks can coexist with other
# icp-cli projects running on this host (port 8000 is first-come-first-served).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
