canisters:
  - name: {{project-name}}
    build:
      steps:
        - commands:
            - command -v python3 >/dev/null 2>&1 || { echo >&2 "python3 not found. Install Python 3.10+."; exit 1; }
            - python3 -c "import basilisk" 2>/dev/null || { echo >&2 "ic-basilisk not found. Run: pip install ic-basilisk"; exit 1; }
            - CANISTER_CANDID_PATH=./{{project-name}}.did python3 -m basilisk {{project-name}} src/main.py
            - cp .basilisk/{{project-name}}/{{project-name}}.wasm "$ICP_WASM_OUTPUT_PATH"
