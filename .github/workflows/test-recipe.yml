name: Recipe Test

on:
  pull_request:
    paths:
      - "icp-cli/**"
  workflow_dispatch:

jobs:
  test-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t basilisk-basic -f icp-cli/tests/Dockerfile.basic-setup .

      - name: Run recipe test in clean Ubuntu 24.04 container
        run: |
          docker run --rm -v $PWD:/basilisk -w /basilisk basilisk-basic \
              bash icp-cli/tests/test-recipe-from-basic-setup.sh
