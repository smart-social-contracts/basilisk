# Cut a release: tag a version bump, build and test every asset from the tagged
# commit in this run (release-build.yml), and attach them with checksums.txt to
# a draft release. It is published (and only then uploaded to PyPI, by
# release-verify.yml) after checksums.txt is signed with the release key:
# smart-social-contracts/.github scripts/sign-release.sh.
#
# Nothing is copied from another release: the signature covers only what this
# run built from the tagged tree (#83). The tag is pushed before the build, so
# if a later job fails, re-run the failed jobs: they build the same commit.
# release-rehearsal.yml runs the same build without the tag and the draft.
name: Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Release notes (markdown). Leave empty for auto-generated notes.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump_version.outputs.NEW_VERSION }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Releases are cut from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release from main, not ${{ github.ref }}. release-rehearsal.yml builds any branch."
          exit 1

      - uses: actions/checkout@v4

      - name: Bump version
        id: bump_version
        run: |
          CURRENT_VERSION=$(grep -Po '__version__ = "\K[^"]*' basilisk/__init__.py)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          case "${{ github.event.inputs.release_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping version: $CURRENT_VERSION -> $NEW_VERSION"

          # Update __init__.py
          sed -i "s/__version__ = \"$CURRENT_VERSION\"/__version__ = \"$NEW_VERSION\"/" basilisk/__init__.py

      - name: Commit and tag version
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add basilisk/__init__.py
          git commit -m "Bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}"
          git tag -a "v${{ steps.bump_version.outputs.NEW_VERSION }}" -m "Release v${{ steps.bump_version.outputs.NEW_VERSION }}"
          git push origin main --tags
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}
      version: ${{ needs.tag.outputs.version }}

  draft:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.tag.outputs.version }}
    steps:
      - name: Download the staged release
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Check it is what release-build staged
        env:
          CHECKSUMS_SHA256: ${{ needs.build.outputs.checksums-sha256 }}
        run: |
          cd release
          echo "$CHECKSUMS_SHA256  checksums.txt" | sha256sum -c -
          grep -v '^#' checksums.txt | sha256sum --strict -c -

      - name: Check the tag still names the commit that was built
        env:
          BUILT: ${{ needs.tag.outputs.sha }}
        run: |
          TAGGED=$(git ls-remote "https://github.com/$GH_REPO" "refs/tags/$TAG^{}" | cut -f1)
          if [ "$TAGGED" != "$BUILT" ]; then
            echo "::error::$TAG names ${TAGGED:-nothing}, but this run built $BUILT."
            exit 1
          fi

      - name: Create draft GitHub Release
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            NOTES=(--notes "$RELEASE_NOTES")
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" "${NOTES[@]}" release/*
