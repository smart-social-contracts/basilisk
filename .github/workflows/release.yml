# Cut a release: bump the version, build, and attach every artifact plus
# checksums.txt to a draft release. It is published (and only then uploaded to
# PyPI, by release-verify.yml) after checksums.txt is signed with the release
# key: smart-social-contracts/.github scripts/sign-release.sh.
name: Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Release notes (markdown). Leave empty for auto-generated notes.'
        required: false
        default: ''
        type: string
env:
    PYTHON_VERSION: "3.13"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Bump version
        id: bump_version
        run: |
          CURRENT_VERSION=$(grep -Po '__version__ = "\K[^"]*' basilisk/__init__.py)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          case "${{ github.event.inputs.release_type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping version: $CURRENT_VERSION -> $NEW_VERSION"
          
          # Update __init__.py
          sed -i "s/__version__ = \"$CURRENT_VERSION\"/__version__ = \"$NEW_VERSION\"/" basilisk/__init__.py
      
      - name: Write build info
        run: |
          COMMIT=$(git rev-parse HEAD | head -c 8)
          DATE=$(git log -1 --format=%cI)
          printf '__commit__ = "%s"\n__date__ = "%s"\n' "$COMMIT" "$DATE" > basilisk/_build_info.py

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      
      - name: Commit and tag version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add basilisk/__init__.py
          git commit -m "Bump version to ${{ steps.bump_version.outputs.NEW_VERSION }}"
          git tag -a "v${{ steps.bump_version.outputs.NEW_VERSION }}" -m "Release v${{ steps.bump_version.outputs.NEW_VERSION }}"
          git push origin main --tags
      
      - name: Download template WASM from cpython-wasm release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The build-cpython-wasm.yml CI uploads the templates to the cpython-wasm-3.13.0-ic1 release.
          # Download them so we can attach them to the versioned release (v{version}):
          # the plain template is where find_template_wasm() looks; the Cedar template
          # is what downstream projects (realms) pin via BASILISK_TEMPLATE_WASM.
          for asset in cpython_canister_template.wasm cpython_canister_template_cedar.wasm; do
            gh release download cpython-wasm-3.13.0-ic1 \
              --pattern "$asset" \
              --dir "${{ runner.temp }}" \
              --clobber || echo "⚠️  $asset not found in cpython-wasm-3.13.0-ic1 release (skipping)"
          done

      - name: Stage assets and checksums
        run: |
          mkdir -p release
          cp dist/* release/
          for asset in cpython_canister_template.wasm cpython_canister_template_cedar.wasm; do
            if [ -f "${{ runner.temp }}/$asset" ]; then
              cp "${{ runner.temp }}/$asset" release/
            else
              echo "⚠️  No $asset to include"
            fi
          done
          [ -f icp-cli/recipe/recipe.hbs ] && cp icp-cli/recipe/recipe.hbs release/
          cd release
          { echo "# SHA-256 checksums for release assets"; sha256sum *; } > ../checksums.txt
          mv ../checksums.txt .
          cat checksums.txt

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          TAG: v${{ steps.bump_version.outputs.NEW_VERSION }}
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            NOTES=(--notes "$RELEASE_NOTES")
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$TAG" --draft --title "$TAG" "${NOTES[@]}" release/*
