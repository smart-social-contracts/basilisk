# Build CPython 3.13 for wasm32-wasip1 and the canister template on top of it.
# Builds only: the artifacts are published to the rolling cpython-wasm release
# by test-all.yml, after every canister test has run on them (#74).
#
# The run builds whenever its template sources (scripts/template_sources_hash.sh)
# differ from the ones the published template was built from. Otherwise it
# hands the published template to the tests under the same artifact name, so
# callers always download `cpython-canister-template` from this run.

name: Build CPython Wasm

on:
    workflow_dispatch: # Manual trigger: always builds
    workflow_call:     # Called by test-all.yml orchestrator
        outputs:
            should-build:
                description: "'true' when this run built the template from its own sources"
                value: ${{ jobs.check-changes.outputs.should-build }}
            sources-hash:
                description: "Hash of the template sources this run tested"
                value: ${{ jobs.check-changes.outputs.sources-hash }}

permissions:
    contents: read

env:
    # Keep in sync with CPYTHON_VERSION and ARTIFACT_REVISION below.
    ROLLING_RELEASE_URL: https://github.com/smart-social-contracts/basilisk/releases/download/cpython-wasm-3.13.0-ic1

jobs:
    check-changes:
        runs-on: ubuntu-latest
        outputs:
            should-build: ${{ steps.check.outputs.should_build }}
            sources-hash: ${{ steps.check.outputs.sources_hash }}
        steps:
            - uses: actions/checkout@v4

            - id: check
              run: |
                  HASH=$(bash scripts/template_sources_hash.sh)
                  echo "sources_hash=$HASH" >> "$GITHUB_OUTPUT"
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "Manual trigger — will build"
                    echo "should_build=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  PUBLISHED=""
                  if RECORD=$(curl -sfL "$ROLLING_RELEASE_URL/template-sources.txt"); then
                    PUBLISHED=$(printf '%s\n' "$RECORD" | awk '$1 == "sources" { print $2 }')
                  fi
                  if [ "$PUBLISHED" = "$HASH" ]; then
                    echo "The published template was built from these sources ($HASH) — reusing it"
                    echo "should_build=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "Template sources $HASH differ from the published template's (${PUBLISHED:-none recorded}) — will build"
                    echo "should_build=true" >> "$GITHUB_OUTPUT"
                  fi

    # Nothing to build: hand the tests the published template, which was built
    # and tested from these exact sources.
    fetch-published-template:
        needs: check-changes
        if: needs.check-changes.outputs.should-build == 'false'
        runs-on: ubuntu-latest
        steps:
            - name: Download published template
              run: |
                  curl -fL "$ROLLING_RELEASE_URL/cpython_canister_template.wasm" \
                    -o "${{ runner.temp }}/cpython_canister_template.wasm"
                  sha256sum "${{ runner.temp }}/cpython_canister_template.wasm"

            - name: Upload template artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cpython-canister-template
                  path: ${{ runner.temp }}/cpython_canister_template.wasm
                  retention-days: 1

    # Guard against source-tree reproducibility drift (zero tolerance).
    #
    # Clones the pinned CPython tag FRESH (never from cache), applies the repo
    # patches, and verifies the resulting tree is byte-exactly pristine+patches.
    # This catches the failure class found in the subinterpreter Step-0 audit:
    # uncommitted, load-bearing modifications living only in a build cache
    # (e.g. frozen encodings) with nothing in the repository. The main build
    # job ALSO runs this verification via build_cpython_wasm.sh, so a stale
    # cache with unpatched drift fails the build too.
    verify-source-tree:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            CPYTHON_VERSION: "3.13.0"
        steps:
            - uses: actions/checkout@v4

            - name: Fresh clone of pinned CPython (no cache)
              run: |
                  git clone --depth 1 --branch "v${CPYTHON_VERSION}" \
                    https://github.com/python/cpython.git /tmp/cpython-fresh

            - name: Apply patches and verify zero drift
              run: |
                  bash basilisk/compiler/cpython/apply_patches.sh \
                    /tmp/cpython-fresh \
                    basilisk/compiler/cpython/patches \
                    --verify-exact

    build-cpython-wasm:
        needs: [check-changes, verify-source-tree]
        if: needs.check-changes.outputs.should-build == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            CPYTHON_VERSION: "3.13.0"
            ARTIFACT_REVISION: "ic1" # keep in sync with install_cpython_wasm.sh
            WASI_SDK_VERSION: "24"
        steps:
            - uses: actions/checkout@v4

            - name: Cache CPython and zlib sources
              uses: actions/cache@v4
              with:
                  path: ~/.cache/basilisk/cpython
                  key: cpython-zlib-source-${{ env.CPYTHON_VERSION }}

            # Cache key MUST include the patch set and patch pipeline, not just
            # the build script: the patches (frozen encodings, teardown-leak
            # backports, instruction metering) change the produced libpython.
            # A key that misses them would serve a stale, unpatched artifact.
            - name: Cache CPython wasm build
              uses: actions/cache@v4
              id: cpython-wasm-cache
              with:
                  path: ~/cpython-wasm-output
                  key: cpython-wasm-${{ env.CPYTHON_VERSION }}-${{ env.ARTIFACT_REVISION }}-wasi-sdk-${{ env.WASI_SDK_VERSION }}-${{ hashFiles('basilisk/compiler/cpython/build_cpython_wasm.sh', 'basilisk/compiler/cpython/apply_patches.sh', 'basilisk/compiler/cpython/patches/**') }}

            - name: Install WASI SDK
              if: steps.cpython-wasm-cache.outputs.cache-hit != 'true'
              run: |
                  echo "Downloading WASI SDK ${{ env.WASI_SDK_VERSION }}..."
                  curl -fLO https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
                  tar xzf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
                  sudo mv wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux /opt/wasi-sdk
                  echo "WASI SDK installed at /opt/wasi-sdk"
                  /opt/wasi-sdk/bin/clang --version

            - name: Build CPython for wasm32-wasip1
              if: steps.cpython-wasm-cache.outputs.cache-hit != 'true'
              run: |
                  WASI_SDK_PATH=/opt/wasi-sdk \
                  bash basilisk/compiler/cpython/build_cpython_wasm.sh ~/cpython-wasm-output

            - name: Verify build output
              run: |
                  echo "=== Build output ==="
                  ls -la ~/cpython-wasm-output/lib/libpython3.13.a
                  ls -la ~/cpython-wasm-output/include/Python.h
                  du -sh ~/cpython-wasm-output/

            - name: Create release tarball
              run: |
                  cd ~/cpython-wasm-output
                  tar czf ${{ runner.temp }}/cpython-wasm32-wasip1.tar.gz .
                  echo "Tarball size: $(du -sh ${{ runner.temp }}/cpython-wasm32-wasip1.tar.gz | cut -f1)"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cpython-wasm32-wasip1
                  path: ${{ runner.temp }}/cpython-wasm32-wasip1.tar.gz
                  retention-days: 90


    build-canister-template:
        runs-on: ubuntu-latest
        needs: [check-changes, build-cpython-wasm]
        if: needs.check-changes.outputs.should-build == 'true'
        timeout-minutes: 30
        env:
            CPYTHON_VERSION: "3.13.0"
            ARTIFACT_REVISION: "ic1" # keep in sync with install_cpython_wasm.sh
            WASI_SDK_VERSION: "24"
            # Pinned, because runner images move stable Rust under us, and
            # gradually: on 19 Nov 2026 a runner still had image 20261111.196
            # (Rust 1.99.1) while the 16 Nov image already had 1.100.0, so two
            # runs of this job on one day could build different templates.
            # Built with 1.100.0 the template gains a wasm start function
            # (_initialize) that calls ic0.time, and every install traps with
            # "ic0_time cannot be executed in start mode". 1.99.1 built the
            # published template.
            #
            # To raise it, change it here in a pull request. The sources hash
            # changes, so that PR builds both templates with the new version,
            # "Check the templates have no start function" runs on both, and
            # every canister suite (unit, local, upgrade) runs on the plain one.
            # No test installs the Cedar template: download the PR's
            # cpython-canister-template-cedar artifact, build a canister on it
            # (BASILISK_TEMPLATE_WASM=<file> icp deploy), and call a method.
            RUST_VERSION: "1.99.1"
        steps:
            - uses: actions/checkout@v4

            - name: Download CPython wasm artifact
              uses: actions/download-artifact@v4
              with:
                  name: cpython-wasm32-wasip1
                  path: ${{ runner.temp }}

            - name: Extract CPython wasm
              run: |
                  mkdir -p ~/cpython-wasm
                  tar xzf ${{ runner.temp }}/cpython-wasm32-wasip1.tar.gz -C ~/cpython-wasm

            - name: Install WASI SDK
              run: |
                  curl -fLO https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
                  tar xzf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
                  sudo mv wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux /opt/wasi-sdk
                  /opt/wasi-sdk/bin/clang --version

            - name: Install Rust ${{ env.RUST_VERSION }} with the wasm32-wasip1 target
              run: |
                  rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-wasip1
                  rustup default "$RUST_VERSION"
                  rustc --version

            - name: Install wasi2ic
              run: cargo install wasi2ic

            - name: Install wasm-opt (binaryen v116)
              run: |
                  curl -L https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz -o /tmp/binaryen.tar.gz
                  tar xzf /tmp/binaryen.tar.gz -C /tmp
                  sudo cp /tmp/binaryen-version_116/bin/wasm-opt /usr/local/bin/
                  wasm-opt --version

            - name: Build canister template
              run: |
                  CPYTHON_WASM_DIR=~/cpython-wasm \
                  WASI_SDK_PATH=/opt/wasi-sdk \
                  cargo build \
                    --manifest-path=basilisk/compiler/cpython_canister_template/Cargo.toml \
                    --target=wasm32-wasip1 \
                    --release

            - name: Post-process template wasm
              run: |
                  TEMPLATE_SRC=basilisk/compiler/cpython_canister_template/target/wasm32-wasip1/release/cpython_canister_template.wasm
                  wasi2ic "$TEMPLATE_SRC" ${{ runner.temp }}/cpython_canister_template.wasm
                  # NOTE: Do NOT run wasm-opt here. wasm-opt merges identical placeholder
                  # functions (python_source_passive_data_size, method_meta_passive_data_size, etc.)
                  # which breaks the wasm manipulator's ability to patch them individually.
                  echo "Template wasm size: $(du -sh ${{ runner.temp }}/cpython_canister_template.wasm | cut -f1)"
                  ls -la ${{ runner.temp }}/cpython_canister_template.wasm

            # A second artifact with Cedar linked in, for canisters that
            # authorize. It is a separate build rather than a default because
            # Cedar costs ~899 KB gzipped, which canisters that never authorize
            # should not carry. Must run after the plain wasm has been copied
            # out of target/, which the post-process step above does.
            - name: Build canister template (Cedar)
              run: |
                  CPYTHON_WASM_DIR=~/cpython-wasm \
                  WASI_SDK_PATH=/opt/wasi-sdk \
                  cargo build \
                    --manifest-path=basilisk/compiler/cpython_canister_template/Cargo.toml \
                    --target=wasm32-wasip1 \
                    --release \
                    --features cedar

            - name: Post-process Cedar template wasm
              run: |
                  TEMPLATE_SRC=basilisk/compiler/cpython_canister_template/target/wasm32-wasip1/release/cpython_canister_template.wasm
                  wasi2ic "$TEMPLATE_SRC" ${{ runner.temp }}/cpython_canister_template_cedar.wasm
                  # Same wasm-opt caveat as the plain template above.
                  echo "Cedar template wasm size: $(du -sh ${{ runner.temp }}/cpython_canister_template_cedar.wasm | cut -f1)"
                  ls -la ${{ runner.temp }}/cpython_canister_template_cedar.wasm

            # No canister test installs the Cedar template, and the plain one
            # only fails at install with an error that does not name its cause.
            - name: Check the templates have no start function
              run: |
                  python3 scripts/check_no_start_function.py \
                    ${{ runner.temp }}/cpython_canister_template.wasm \
                    ${{ runner.temp }}/cpython_canister_template_cedar.wasm

            - name: Upload template artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cpython-canister-template
                  path: ${{ runner.temp }}/cpython_canister_template.wasm
                  retention-days: 90

            - name: Upload Cedar template artifact
              uses: actions/upload-artifact@v4
              with:
                  name: cpython-canister-template-cedar
                  path: ${{ runner.temp }}/cpython_canister_template_cedar.wasm
                  retention-days: 90
