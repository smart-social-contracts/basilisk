# Unit Tests — fast, pure-Python tests that need no icp-cli, WASM, or canisters.
# Covers build-time bundling logic (native extension detection, unresolved
# import warnings, bundle summary) added for GitHub issue #31.

name: Unit Tests

# Pull requests and main run this through test-all.yml.
on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

env:
    PYTHON_VERSION: "3.13"

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install dependencies
              # pyyaml: test_release_workflows.py reads the workflow files.
              run: pip install pytest pyyaml

            - name: Run unit tests
              # test_subinterpreter_stubs self-skips when the host CPython
              # build (builddir/build/libpython3.13.a) is absent.
              run: python -m pytest tests/test_bundle.py tests/test_apply_patches.py tests/test_subinterpreter_stubs.py tests/test_capability_intersection.py tests/test_result_validation.py tests/test_builtin_endpoints.py tests/test_lazy_module.py tests/test_frozen_json.py tests/test_frozen_hashlib.py tests/test_check_no_start_function.py tests/test_post_upgrade_wrapper.py tests/test_frozen_time.py tests/test_frozen_enum_weakref_struct.py -v

            - name: Run release-path tests
              run: python -m pytest tests/test_stage_release.py tests/test_release_workflows.py -v

    # Reproducibility guard: the repo's CPython patches must apply cleanly to
    # a FRESH fetch of the pinned commit, and the patched tree must contain no
    # modifications beyond the patch files (zero drift). Runs on every PR so
    # patch changes cannot merge in a state that only works against someone's
    # local build cache.
    verify-cpython-patches:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - name: Fetch pinned CPython fresh (no cache), apply patches, verify zero drift
              run: |
                  CPYTHON_CACHE_DIR="$(mktemp -d)" \
                  bash basilisk/compiler/cpython/build_cpython_wasm.sh --verify-source
