# Orchestrator workflow: runs every test suite on the canister template these
# sources build, on pull requests and on main, and publishes that template only
# after all of them pass (#74).
#
# wasm-build builds the template when its sources differ from the published
# one, or else hands the published one on; either way the tests download it
# from this run as the `cpython-canister-template` artifact.
#
# IC tests use a live canister on IC mainnet (gfs5q-6qaaa-aaaae-ag5nq-cai), so
# they run on main only. setup-ic-canister reinstalls WASM before tests;
# teardown stops the canister to save idle cycles. IC_IDENTITY_PEM must be a
# controller, or set IC_CONTROLLER_PEM (PEM identity that is a controller) so
# CI can re-grant access automatically.

name: All Tests
on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: all-tests-${{ github.ref }}
    cancel-in-progress: true

env:
    PYTHON_VERSION: "3.13"

permissions:
    contents: read

jobs:
    wasm-build:
        uses: ./.github/workflows/build-cpython-wasm.yml
        secrets: inherit

    upgrade-test:
        needs: wasm-build
        uses: ./.github/workflows/test-upgrade.yml
        with:
            template-from-run: true
        secrets: inherit

    setup-ic-canister:
        needs: wasm-build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        env:
            CANISTER_ID: gfs5q-6qaaa-aaaae-ag5nq-cai
            NETWORK: ic
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install icp-cli
              run: |
                  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/dfinity/icp-cli/releases/latest/download/icp-cli-installer.sh | sh
                  echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            - name: Import identity
              env:
                  IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
              run: |
                  if [ -z "$IC_IDENTITY_PEM" ]; then
                    echo "::error::IC_IDENTITY_PEM secret is not set."
                    exit 1
                  fi
                  umask 077
                  printf '%s' "$IC_IDENTITY_PEM" > /tmp/ci-identity.pem
                  icp identity import --from-pem /tmp/ci-identity.pem --storage plaintext ci-deploy 2>/dev/null || true
                  rm /tmp/ci-identity.pem
                  icp identity default ci-deploy
                  echo "Deploy principal: $(icp identity principal)"

            - name: Install basilisk and test dependencies
              run: |
                  pip install -e .

            - name: Download this run's canister template
              uses: actions/download-artifact@v4
              with:
                  name: cpython-canister-template
                  path: ${{ runner.temp }}/template

            - name: Use it for the build
              run: |
                  TEMPLATE="${{ runner.temp }}/template/cpython_canister_template.wasm"
                  sha256sum "$TEMPLATE"
                  echo "BASILISK_TEMPLATE_WASM=$TEMPLATE" >> "$GITHUB_ENV"

            - name: Build test canister WASM
              working-directory: tests/test_canister
              run: |
                  CANISTER_CANDID_PATH=./shell_test.did python -m basilisk shell_test src/main.py
                  ls -la .basilisk/shell_test/shell_test.wasm

            - name: Reinstall canister with fresh WASM
              env:
                  IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
                  IC_CONTROLLER_PEM: ${{ secrets.IC_CONTROLLER_PEM }}
                  IC_IDENTITY_PEM_2: ${{ secrets.IC_IDENTITY_PEM_2 }}
                  WASM_PATH: tests/test_canister/.basilisk/shell_test/shell_test.wasm
              run: |
                  bash scripts/ci_prepare_test_canister.sh

    ic-tests:
        needs: setup-ic-canister
        if: ${{ !cancelled() && needs.setup-ic-canister.result == 'success' }}
        uses: ./.github/workflows/test-shell.yml
        secrets: inherit

    teardown-ic-canister:
        needs: ic-tests
        if: always() && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        env:
            CANISTER_ID: gfs5q-6qaaa-aaaae-ag5nq-cai
            NETWORK: ic
        steps:
            - name: Install icp-cli
              run: |
                  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/dfinity/icp-cli/releases/latest/download/icp-cli-installer.sh | sh
                  echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            - name: Import identity
              env:
                  IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
                  IC_CONTROLLER_PEM: ${{ secrets.IC_CONTROLLER_PEM }}
                  IC_IDENTITY_PEM_2: ${{ secrets.IC_IDENTITY_PEM_2 }}
              run: |
                  if [ -z "${IC_IDENTITY_PEM:-}" ]; then
                    echo "::warning::IC_IDENTITY_PEM not set; skipping canister stop."
                    exit 0
                  fi
                  umask 077
                  printf '%s' "$IC_IDENTITY_PEM" > /tmp/ci-identity.pem
                  icp identity import --from-pem /tmp/ci-identity.pem --storage plaintext ci-deploy 2>/dev/null || true
                  rm /tmp/ci-identity.pem
                  icp identity default ci-deploy
                  CONTROLLER_PEM="${IC_CONTROLLER_PEM:-${IC_IDENTITY_PEM_2:-}}"
                  if [ -n "$CONTROLLER_PEM" ]; then
                    printf '%s' "$CONTROLLER_PEM" > /tmp/ci-controller.pem
                    icp identity import --from-pem /tmp/ci-controller.pem --storage plaintext ci-controller 2>/dev/null || true
                    rm /tmp/ci-controller.pem
                  fi

            - name: Stop canister
              env:
                  IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
                  IC_CONTROLLER_PEM: ${{ secrets.IC_CONTROLLER_PEM }}
                  IC_IDENTITY_PEM_2: ${{ secrets.IC_IDENTITY_PEM_2 }}
              run: |
                  if [ -z "${IC_IDENTITY_PEM:-}" ]; then
                    exit 0
                  fi
                  DEPLOY_PRINCIPAL="$(icp identity principal)"
                  MGMT_IDENTITY="ci-deploy"
                  if ! icp canister status "$CANISTER_ID" -n "$NETWORK" 2>/dev/null | grep -q "$DEPLOY_PRINCIPAL"; then
                    CONTROLLER_PEM="${IC_CONTROLLER_PEM:-${IC_IDENTITY_PEM_2:-}}"
                    if [ -n "$CONTROLLER_PEM" ] && icp identity list 2>/dev/null | grep -q "ci-controller"; then
                      icp identity default ci-controller
                      MGMT_IDENTITY="ci-controller"
                    else
                      echo "::warning::Deploy identity is not a controller; leaving canister running."
                      exit 0
                    fi
                  fi
                  echo "Stopping canister $CANISTER_ID on $NETWORK via $MGMT_IDENTITY..."
                  icp canister stop "$CANISTER_ID" -n "$NETWORK" --identity "$MGMT_IDENTITY" || true

    unit-tests:
        uses: ./.github/workflows/test-unit.yml
        secrets: inherit

    local-tests:
        needs: wasm-build
        uses: ./.github/workflows/test-integration.yml
        with:
            template-from-run: true
        secrets: inherit

    # The only way a template reaches the rolling release: built by this run
    # from main, and every canister test above has passed on it.
    publish-template:
        needs: [wasm-build, unit-tests, upgrade-test, local-tests, ic-tests]
        if: github.ref == 'refs/heads/main' && needs.wasm-build.outputs.should-build == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download this run's CPython and template artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: cpython-*
                  path: ${{ runner.temp }}/publish
                  merge-multiple: true

            # check-changes compares the next run's sources with this record;
            # find_template_wasm checks a download against checksums.txt (#68).
            - name: Record the sources they were built from, and their checksums
              run: |
                  cd "${{ runner.temp }}/publish"
                  {
                    echo "# Template sources the assets of this release were built and tested from"
                    echo "sources ${{ needs.wasm-build.outputs.sources-hash }}"
                    echo "commit ${{ github.sha }}"
                  } > template-sources.txt
                  { echo "# SHA-256 checksums for release assets"; sha256sum *.tar.gz *.wasm; } > checksums.txt
                  cat template-sources.txt checksums.txt

            - name: Publish to the rolling release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: cpython-wasm-3.13.0-ic1
                  name: CPython 3.13.0 wasm32-wasip1 (ic1)
                  body: |
                      Pre-built CPython 3.13.0 static library for wasm32-wasip1,
                      with the Basilisk IC patch set revision ic1
                      (basilisk/compiler/cpython/patches/) applied, and the canister
                      templates built on it. Published by the All Tests workflow
                      after every canister test passed on these templates;
                      `template-sources.txt` names the commit.
                      Used by `install_cpython_wasm.sh` and `find_template_wasm`
                      during basilisk canister builds.

                      Contents:
                      - `cpython-wasm32-wasip1.tar.gz` — `lib/libpython3.13.a`, CPython headers, frozen stdlib modules
                      - `cpython_canister_template.wasm`, `cpython_canister_template_cedar.wasm` — canister templates
                      - `template-sources.txt` — the sources they were built from
                      - `checksums.txt` — their SHA-256, not signed (versioned releases are)
                  files: |
                      ${{ runner.temp }}/publish/cpython-wasm32-wasip1.tar.gz
                      ${{ runner.temp }}/publish/cpython_canister_template.wasm
                      ${{ runner.temp }}/publish/cpython_canister_template_cedar.wasm
                      ${{ runner.temp }}/publish/template-sources.txt
                      ${{ runner.temp }}/publish/checksums.txt
                  fail_on_unmatched_files: true
                  draft: false
                  prerelease: false
                  make_latest: false
