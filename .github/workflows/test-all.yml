# Orchestrator workflow that runs all test suites on push to main.
# First builds the CPython WASM template (if template paths changed),
# then runs all test suites in parallel.
#
# IC tests use a live canister on IC mainnet (gfs5q-6qaaa-aaaae-ag5nq-cai).
# setup-ic-canister reinstalls WASM before tests; teardown stops the canister to
# save idle cycles. IC_IDENTITY_PEM must be a controller, or set IC_CONTROLLER_PEM
# (PEM identity that is a controller) so CI can re-grant access automatically.

name: All Tests
on:
    workflow_dispatch:
    push:
        branches:
            - main

concurrency:
    group: ci-main-${{ github.ref }}
    cancel-in-progress: true

env:
    PYTHON_VERSION: "3.13"

permissions:
    contents: write # Required by build-cpython-wasm for GitHub releases
    actions: write  # Required by build-cpython-wasm for workflow dispatch

jobs:
    wasm-build:
        uses: ./.github/workflows/build-cpython-wasm.yml
        secrets: inherit

    upgrade-test:
        needs: wasm-build
        if: ${{ !cancelled() && needs.wasm-build.result != 'failure' }}
        uses: ./.github/workflows/test-upgrade.yml
        secrets: inherit

    setup-ic-canister:
        needs: wasm-build
        if: ${{ !cancelled() && needs.wasm-build.result != 'failure' }}
        runs-on: ubuntu-latest
        env:
            CANISTER_ID: gfs5q-6qaaa-aaaae-ag5nq-cai
            NETWORK: ic
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install icp-cli
              run: |
                  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/dfinity/icp-cli/releases/latest/download/icp-cli-installer.sh | sh
                  echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            - name: Import identity
              env:
                  IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
              run: |
                  if [ -z "$IC_IDENTITY_PEM" ]; then
                    echo "::error::IC_IDENTITY_PEM secret is not set."
                    exit 1
                  fi
                  umask 077
                  printf '%s' "$IC_IDENTITY_PEM" > /tmp/ci-identity.pem
                  icp identity import --from-pem /tmp/ci-identity.pem --storage plaintext ci-deploy 2>/dev/null || true
                  rm /tmp/ci-identity.pem
                  icp identity default ci-deploy
                  echo "Deploy principal: $(icp identity principal)"

            - name: Install basilisk and test dependencies
              run: |
                  pip install -e .

            - name: Pre-download canister template
              run: |
                  VERSION=$(python3 -c "import basilisk; print(basilisk.__version__)")
                  TEMPLATE_DIR="$HOME/.config/basilisk/${VERSION}"
                  mkdir -p "$TEMPLATE_DIR"
                  curl -Lf "https://github.com/smart-social-contracts/basilisk/releases/download/cpython-wasm-3.13.0-ic1/cpython_canister_template.wasm" \
                    -o "$TEMPLATE_DIR/cpython_canister_template.wasm"
                  echo "Template cached at $TEMPLATE_DIR/cpython_canister_template.wasm ($(du -sh "$TEMPLATE_DIR/cpython_canister_template.wasm" | cut -f1))"

            - name: Build test canister WASM
              working-directory: tests/test_canister
              run: |
                  CANISTER_CANDID_PATH=./shell_test.did python -m basilisk shell_test src/main.py
                  ls -la .basilisk/shell_test/shell_test.wasm

            - name: Reinstall canister with fresh WASM
              env:
                  IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
                  IC_CONTROLLER_PEM: ${{ secrets.IC_CONTROLLER_PEM }}
                  IC_IDENTITY_PEM_2: ${{ secrets.IC_IDENTITY_PEM_2 }}
                  WASM_PATH: tests/test_canister/.basilisk/shell_test/shell_test.wasm
              run: |
                  bash scripts/ci_prepare_test_canister.sh

    ic-tests:
        needs: setup-ic-canister
        if: ${{ !cancelled() && needs.setup-ic-canister.result == 'success' }}
        uses: ./.github/workflows/test-shell.yml
        secrets: inherit

    teardown-ic-canister:
        needs: ic-tests
        if: always()
        runs-on: ubuntu-latest
        env:
            CANISTER_ID: gfs5q-6qaaa-aaaae-ag5nq-cai
            NETWORK: ic
        steps:
            - name: Install icp-cli
              run: |
                  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/dfinity/icp-cli/releases/latest/download/icp-cli-installer.sh | sh
                  echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            - name: Import identity
              env:
                  IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
                  IC_CONTROLLER_PEM: ${{ secrets.IC_CONTROLLER_PEM }}
                  IC_IDENTITY_PEM_2: ${{ secrets.IC_IDENTITY_PEM_2 }}
              run: |
                  if [ -z "${IC_IDENTITY_PEM:-}" ]; then
                    echo "::warning::IC_IDENTITY_PEM not set; skipping canister stop."
                    exit 0
                  fi
                  umask 077
                  printf '%s' "$IC_IDENTITY_PEM" > /tmp/ci-identity.pem
                  icp identity import --from-pem /tmp/ci-identity.pem --storage plaintext ci-deploy 2>/dev/null || true
                  rm /tmp/ci-identity.pem
                  icp identity default ci-deploy
                  CONTROLLER_PEM="${IC_CONTROLLER_PEM:-${IC_IDENTITY_PEM_2:-}}"
                  if [ -n "$CONTROLLER_PEM" ]; then
                    printf '%s' "$CONTROLLER_PEM" > /tmp/ci-controller.pem
                    icp identity import --from-pem /tmp/ci-controller.pem --storage plaintext ci-controller 2>/dev/null || true
                    rm /tmp/ci-controller.pem
                  fi

            - name: Stop canister
              env:
                  IC_IDENTITY_PEM: ${{ secrets.IC_IDENTITY_PEM }}
                  IC_CONTROLLER_PEM: ${{ secrets.IC_CONTROLLER_PEM }}
                  IC_IDENTITY_PEM_2: ${{ secrets.IC_IDENTITY_PEM_2 }}
              run: |
                  if [ -z "${IC_IDENTITY_PEM:-}" ]; then
                    exit 0
                  fi
                  DEPLOY_PRINCIPAL="$(icp identity principal)"
                  MGMT_IDENTITY="ci-deploy"
                  if ! icp canister status "$CANISTER_ID" -n "$NETWORK" 2>/dev/null | grep -q "$DEPLOY_PRINCIPAL"; then
                    CONTROLLER_PEM="${IC_CONTROLLER_PEM:-${IC_IDENTITY_PEM_2:-}}"
                    if [ -n "$CONTROLLER_PEM" ] && icp identity list 2>/dev/null | grep -q "ci-controller"; then
                      icp identity default ci-controller
                      MGMT_IDENTITY="ci-controller"
                    else
                      echo "::warning::Deploy identity is not a controller; leaving canister running."
                      exit 0
                    fi
                  fi
                  echo "Stopping canister $CANISTER_ID on $NETWORK via $MGMT_IDENTITY..."
                  icp canister stop "$CANISTER_ID" -n "$NETWORK" --identity "$MGMT_IDENTITY" || true

    unit-tests:
        uses: ./.github/workflows/test-unit.yml
        secrets: inherit

    local-tests:
        needs: wasm-build
        if: ${{ !cancelled() && needs.wasm-build.result != 'failure' }}
        uses: ./.github/workflows/test-integration.yml
        secrets: inherit
