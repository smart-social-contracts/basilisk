# Standalone test for the upgrade_test example
# This test verifies decentralized canister upgrades using IC's chunked code upload API
#
# Pull requests and main run this through test-all.yml, which passes
# template-from-run so the canisters are built on the template that run built
# or vetted. Run by hand, it uses the published template.

name: Upgrade Test
on:
    workflow_dispatch:
    workflow_call: # Called by test-all.yml orchestrator
        inputs:
            template-from-run:
                description: "Build on the run's cpython-canister-template artifact instead of the published template"
                type: boolean
                default: false

jobs:
    upgrade-test:
        runs-on: ubuntu-latest
        env:
            WASI_SDK_VERSION: "24"
            WASI_SDK_PATH: /home/runner/.local/share/wasi-sdk
            PYTHON_VERSION: "3.13"
        steps:
            - uses: actions/checkout@v4

            - uses: actions/cache@v4
              with:
                  path: ~/.config/basilisk
                  key: basilisk-cargo-cpython-v4-${{ hashFiles('basilisk/cargotoml.py') }}

            - name: Install icp-cli
              run: |
                  curl --proto '=https' --tlsv1.2 -LsSf https://github.com/dfinity/icp-cli/releases/latest/download/icp-cli-installer.sh | sh
                  echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            - name: Install WASI SDK
              run: |
                  mkdir -p ~/.local/share
                  curl -LO https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${{ env.WASI_SDK_VERSION }}/wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
                  tar xzf wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux.tar.gz
                  mv wasi-sdk-${{ env.WASI_SDK_VERSION }}.0-x86_64-linux ~/.local/share/wasi-sdk

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Download the run's canister template
              if: inputs.template-from-run
              uses: actions/download-artifact@v4
              with:
                  name: cpython-canister-template
                  path: ${{ runner.temp }}/template

            - name: Download the published canister template
              if: ${{ !inputs.template-from-run }}
              run: |
                  curl -Lf --create-dirs https://github.com/smart-social-contracts/basilisk/releases/download/cpython-wasm-3.13.0-ic1/cpython_canister_template.wasm \
                    -o "${{ runner.temp }}/template/cpython_canister_template.wasm"

            # Explicit, so the build cannot pick up a template cached in
            # ~/.config/basilisk or the v{version} release instead.
            - name: Use it for the build
              run: |
                  TEMPLATE="${{ runner.temp }}/template/cpython_canister_template.wasm"
                  sha256sum "$TEMPLATE"
                  echo "BASILISK_TEMPLATE_WASM=$TEMPLATE" >> "$GITHUB_ENV"

            - name: Setup venv and install basilisk from repo
              working-directory: tests/fixtures/upgrade_test
              run: |
                  python -m venv venv
                  source venv/bin/activate
                  pip install ../../../

            - name: Run upgrade test
              working-directory: tests/fixtures/upgrade_test
              timeout-minutes: 30
              run: |
                  source venv/bin/activate
                  bash test_upgrade.sh
