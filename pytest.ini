[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests requiring a PocketIC replica
addopts = -v --tb=short
# An xfail that passes fails the run: a marker cannot outlive its bug unseen.
xfail_strict = true
