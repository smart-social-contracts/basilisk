[package]
name = "cpython_canister_template"
version = "0.0.0"
edition = "2021"

[profile.release]
opt-level = 'z'
lto = true
incremental = false
codegen-units = 1

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Links Cedar in and exposes the _basilisk_cedar module. Off by default because
# it costs ~899 KB gzipped, which canisters that do not authorize should not pay.
# The template is published as two artifacts, plain and Cedar, selected in
# dfx.json.
#
# The validator is included rather than evaluation alone: policies arrive at
# runtime from third parties, so the canister cannot rely on a publisher's CI
# having typechecked them.
cedar = ["dep:cedar-policy"]

[dependencies]
ic-cdk = "0.13.5"
ic-cdk-macros = "0.9.0"
ic-cdk-timers = "0.7.0"
candid = { version = "0.10.6", features = ["value"] }
candid_parser = "0.1.4"
basilisk_cpython = { path = "../basilisk_cpython" }
num-bigint = "0.4"
serde = { version = "1.0.137", default-features = false, features = [] }
serde_json = "1.0"
async-recursion = "1.0.0"
ic-stable-structures = "0.6.5"
slotmap = "1.0.6"
ic-wasi-polyfill = { version = "0.6.1", features = ["transient"] }
cedar-policy = { version = "4.12.0", optional = true }

[patch.crates-io]
num-bigint = { git = "https://github.com/rust-num/num-bigint", rev = "575cea47d21f969e541a7668751d4a82825d02bd" }
ic-wasi-polyfill = { path = "../ic-wasi-polyfill-patched" }
